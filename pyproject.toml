[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "build", "dist"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
show_missing = true
